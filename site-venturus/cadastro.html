<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro</title>
  <link rel="stylesheet" href="cadastro.css"> <!-- Link para o CSS externo -->
</head>
<body>

  <div class="form-container">
    <div class="form-box">
      <h2>Cadastro</h2>

      <form action="cadastro_action.php" method="POST">

        <div class="input-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="input-group">
          <label for="sobrenome">Sobrenome</label>
          <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
        </div>

        <div class="input-group">
          <label for="confirmar-senha">Confirmar Senha</label>
          <input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="Confirme sua senha" required>
        </div>

        <div class="input-group">
          <label for="data-nascimento">Data de Nascimento</label>
          <input type="date" id="data-nascimento" name="data_nascimento" required>
        </div>

        <button type="submit">Cadastrar</button>
      </form>

    </div>
  </div>

</body>
</html>
